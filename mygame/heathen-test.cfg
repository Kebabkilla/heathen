// First-launch diagnostics only. Not a shipping gameplay configuration.
// Launcher sets game/basedir/libdir/homedir and disables audio before init.
set deathmatch 0
set coop 1
set maxclients 4
set cheats 0
set allow_download 0
set skin "male/grunt"
set name "HeathenTester"
set cl_predict 1
set cl_thirdperson 0
set cl_vwep 0
set cl_gun 0
set scr_draw2d 0
set crosshair 0
set freelook 1
set sensitivity 3
set gl_texturemode "GL_NEAREST_MIPMAP_NEAREST"
set vid_fullscreen 0

// Escape opens the console, not a menu requiring retail UI art.
// No attack/use bindings: this checkpoint tests spawning and movement only.
unbindall
bind "w" "+forward"
bind "s" "+back"
bind "a" "+moveleft"
bind "d" "+moveright"
bind "SPACE" "+moveup"
bind "CTRL" "+movedown"
bind "ESCAPE" "toggleconsole"
bind "`" "toggleconsole"
bind "F10" "quit"
bind "F12" "screenshot"
echo "HEATHEN FIRST-LAUNCH TEST - ORIGINAL PLACEHOLDERS"
map tpp_test
